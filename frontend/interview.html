<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interview</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container interview-container">

    <div class="header">
      <h1>AI Interviewer</h1>
      <p id="welcome"></p>
    </div>

    <div class="interview-info">
      <span id="role"></span>
      <span id="difficulty"></span>
      <span id="question-count"></span>
    </div>

    <div class="timer-box">
      <p id="timer">Time Left: 30s</p>
    </div>

    <div class="question-box">
      <p class="question-label">Interview Question</p>

      <p id="question-counter">Question 1 of 2</p>
      <progress id="progress-bar" value="1" max="2"></progress>
      <h2 id="question">
        Click Start to Begin
      </h2>
    </div>

    <textarea
      id="answer"
      rows="7"
      placeholder="Type your answer here..."
    ></textarea>

    <button id="mic-btn">
      🎤 Start Speaking
    </button>

    <button id="next-button">
      Start Interview
    </button>

  </div>

  <script src="interview.js"></script>

</body>

</html>
